name: NextTurn Backend - Database Migration

# ==============================================================================
# Triggers:
# 1. workflow_run: Automatically runs after CI completes successfully on main.
# 2. workflow_dispatch: Manual dispatch on demand.
# ==============================================================================
on:
  workflow_run:
    workflows: ["NextTurn Backend - Continuous Integration (CI)"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate Database Schema
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # Only run on manual trigger or when CI finishes with success
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Tailscale and SSH deployment secrets
        id: check_secrets
        run: |
          MISSING_SECRETS=""
          if [ -z "${{ secrets.TAILSCALE_AUTHKEY }}" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} TAILSCALE_AUTHKEY"
          fi
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} VM_HOST"
          fi
          if [ -z "${{ secrets.VM_SSH_PRIVATE_KEY }}" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} VM_SSH_PRIVATE_KEY"
          fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::error::Missing required secrets for migration:${MISSING_SECRETS}."
            exit 1
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      # 1. Connect to Tailscale as Ephemeral Node
      - name: Connect to Tailscale as Ephemeral Node
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:nextturn-gitops
          args: --accept-routes

      # 2. Verify Tailscale connectivity to target VM
      - name: Verify Tailscale connectivity to server
        run: |
          echo "Pinging target VM on Tailnet (${{ secrets.VM_HOST }})..."
          tailscale ping -c 3 ${{ secrets.VM_HOST }} || ping -c 3 ${{ secrets.VM_HOST }}

      # 3. Setup SSH Private Key into ssh-agent
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      # 4. Scan and trust VM host key over Tailnet
      - name: Scan and add SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      # 5. Copy migration SQL scripts to server via native SCP
      - name: Copy migration SQL scripts via native SCP
        run: |
          DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/mnt/data/nextturn' }}"
          REMOTE_USER="${{ secrets.VM_USER || 'ryan' }}"
          REMOTE_HOST="${{ secrets.VM_HOST }}"

          echo "==> Creating migrations directory on target server..."
          ssh ${REMOTE_USER}@${REMOTE_HOST} "mkdir -p ${DEPLOY_DIR}/migrations"

          echo "==> Copying SQL scripts to migrations directory..."
          scp -r src/main/resources/db/migration/*.sql ${REMOTE_USER}@${REMOTE_HOST}:${DEPLOY_DIR}/migrations/

      # 6. Execute Flyway migration via SSH
      - name: Execute Flyway migration on server
        run: |
          ssh ${{ secrets.VM_USER || 'ryan' }}@${{ secrets.VM_HOST }} << 'EOF'
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/mnt/data/nextturn' }}"
            MIGRATIONS_DIR="${DEPLOY_DIR}/migrations"

            # Locate .env configuration file
            ENV_FILE="${DEPLOY_DIR}/.env"
            if [ ! -f "$ENV_FILE" ] && [ -f "${DEPLOY_DIR}/backend/.env" ]; then
              ENV_FILE="${DEPLOY_DIR}/backend/.env"
            fi

            if [ ! -f "$ENV_FILE" ]; then
              echo "::error::Configuration file not found at ${ENV_FILE}. Cannot determine database connection details."
              exit 1
            fi

            # Extract database connection details from .env
            DB_URL=$(grep -E '^\s*(SPRING_DATASOURCE_URL|MYSQL_URL)\s*=' "$ENV_FILE" | head -n 1 | cut -d '=' -f2- | tr -d ' "' | tr -d "'")
            DB_USER=$(grep -E '^\s*(SPRING_DATASOURCE_USERNAME|MYSQL_USER)\s*=' "$ENV_FILE" | head -n 1 | cut -d '=' -f2- | tr -d ' "' | tr -d "'")
            DB_PASS=$(grep -E '^\s*(SPRING_DATASOURCE_PASSWORD|MYSQL_PASSWORD)\s*=' "$ENV_FILE" | head -n 1 | cut -d '=' -f2- | tr -d ' "' | tr -d "'")

            # Handle escaped hash character in password
            DB_PASS=$(echo "$DB_PASS" | sed 's/\\#/#/g')

            echo "==> 1. Ensuring shared container network nextturn-network exists..."
            podman network exists nextturn-network || podman network create --driver bridge nextturn-network

            echo "==> 2. Pulling stable Flyway image for ARM64..."
            podman pull docker.io/flyway/flyway:11-alpine

            echo "==> 3. Setting migrations directory permissions..."
            chmod -R 755 "${MIGRATIONS_DIR}"

            echo "==> 4. Running Flyway container to execute migration..."
            podman run --rm \
              --network nextturn-network \
              -v "${MIGRATIONS_DIR}:/flyway/sql:ro,z" \
              docker.io/flyway/flyway:11-alpine \
              -url="${DB_URL}" \
              -user="${DB_USER}" \
              -password="${DB_PASS}" \
              -baselineOnMigrate=true \
              migrate

            echo "==> Database migration completed successfully!"
          EOF
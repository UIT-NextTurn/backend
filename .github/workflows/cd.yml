name: NextTurn Backend - Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["NextTurn Backend - Database Migration"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: 'Deploy container image to Oracle Linux 9 server'
        required: true
        default: true
        type: boolean
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - 'production'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set lowercased repository image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event.workflow_run.head_branch == 'main' }}

      - name: Build and push native ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,ignore-error=true,scope=backend

  deploy:
    name: Deploy to Oracle Linux 9 Server (Tailscale Ephemeral Node)
    needs: build-and-push
    if: >-
      always() &&
      needs.build-and-push.result == 'success' &&
      (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_server == true))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Set lowercased repository image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Check Tailscale and SSH deployment secrets
        id: check_secrets
        run: |
          MISSING_SECRETS=""
          if [ -z "${{ secrets.TAILSCALE_AUTHKEY }}" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} TAILSCALE_AUTHKEY"
          fi
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} VM_HOST"
          fi
          if [ -z "${{ secrets.VM_SSH_PRIVATE_KEY }}" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} VM_SSH_PRIVATE_KEY"
          fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::Missing required secrets for Tailscale deployment:${MISSING_SECRETS}. Remote deployment step skipped."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Connect to Tailscale as Ephemeral Node
        if: steps.check_secrets.outputs.configured == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:nextturn-gitops
          args: --accept-routes

      - name: Verify Tailscale connectivity to server
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          echo "Pinging target VM on Tailnet (${{ secrets.VM_HOST }})..."
          tailscale ping -c 3 ${{ secrets.VM_HOST }} || ping -c 3 ${{ secrets.VM_HOST }}

      - name: Execute deployment commands via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER || 'ryan' }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          envs: REGISTRY,IMAGE_NAME,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/mnt/data/nextturn/backend' }}"
            
            echo "==> 1. Authenticating Podman with GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "==> 2. Pulling latest ARM64 container image..."
            podman pull "${REGISTRY}/${IMAGE_NAME}:latest"

            echo "==> 3. Ensuring shared network exists..."
            podman network exists nextturn-network || podman network create --driver bridge nextturn-network

            # Resolve environment configuration file
            ENV_FILE="${DEPLOY_DIR}/.env"
            if [ ! -f "$ENV_FILE" ] && [ -f "${DEPLOY_DIR}/backend/.env" ]; then
              ENV_FILE="${DEPLOY_DIR}/backend/.env"
            fi

            # Default container configurations
            CONTAINER_NAME="nextturn-backend"
            PORT_MAPPING="8080:8080"
            ENV_FLAG=""

            if [ -f "$ENV_FILE" ]; then
              ENV_FLAG="--env-file $ENV_FILE"

              # 1. Parse container name from .env (supports CONTAINER_NAME or BACKEND_CONTAINER_NAME)
              PARSED_NAME=$(grep -E '^\s*(CONTAINER_NAME|BACKEND_CONTAINER_NAME)\s*=' "$ENV_FILE" | head -n 1 | cut -d '=' -f2- | tr -d ' "' | tr -d "'")
              if [ -n "$PARSED_NAME" ]; then
                CONTAINER_NAME="$PARSED_NAME"
              fi

              # 2. Parse port mapping from .env (supports PORT_MAPPING, or HOST_PORT:SERVER_PORT, or SERVER_PORT)
              PARSED_PORT_MAP=$(grep -E '^\s*PORT_MAPPING\s*=' "$ENV_FILE" | head -n 1 | cut -d '=' -f2- | tr -d ' "' | tr -d "'")
              PARSED_HOST_PORT=$(grep -E '^\s*(HOST_PORT|BACKEND_PORT)\s*=' "$ENV_FILE" | head -n 1 | cut -d '=' -f2- | tr -d ' "' | tr -d "'")
              PARSED_SERVER_PORT=$(grep -E '^\s*SERVER_PORT\s*=' "$ENV_FILE" | head -n 1 | cut -d '=' -f2- | tr -d ' "' | tr -d "'")

              if [ -n "$PARSED_PORT_MAP" ]; then
                PORT_MAPPING="$PARSED_PORT_MAP"
              elif [ -n "$PARSED_HOST_PORT" ] && [ -n "$PARSED_SERVER_PORT" ]; then
                PORT_MAPPING="${PARSED_HOST_PORT}:${PARSED_SERVER_PORT}"
              elif [ -n "$PARSED_SERVER_PORT" ]; then
                PORT_MAPPING="${PARSED_SERVER_PORT}:${PARSED_SERVER_PORT}"
              elif [ -n "$PARSED_HOST_PORT" ]; then
                PORT_MAPPING="${PARSED_HOST_PORT}:8080"
              fi
              echo "==> Using configuration from $ENV_FILE: CONTAINER_NAME=${CONTAINER_NAME}, PORT_MAPPING=${PORT_MAPPING}"
            else
              echo "::notice::Warning: $ENV_FILE not found, starting with defaults: name=${CONTAINER_NAME}, port=${PORT_MAPPING}"
            fi

            echo "==> 4. Gracefully stopping previous container (${CONTAINER_NAME})..."
            podman stop "${CONTAINER_NAME}" 2>/dev/null || true
            podman rm "${CONTAINER_NAME}" 2>/dev/null || true

            echo "==> 5. Starting updated NextTurn Backend container (${CONTAINER_NAME} on ${PORT_MAPPING})..."
            if [ -f "$ENV_FILE" ]; then
              podman run -d \
                --name "${CONTAINER_NAME}" \
                --restart unless-stopped \
                --network nextturn-network \
                -p "${PORT_MAPPING}" \
                --env-file "$ENV_FILE" \
                "${REGISTRY}/${IMAGE_NAME}:latest"
            else
              podman run -d \
                --name "${CONTAINER_NAME}" \
                --restart unless-stopped \
                --network nextturn-network \
                -p "${PORT_MAPPING}" \
                "${REGISTRY}/${IMAGE_NAME}:latest"
            fi

            echo "==> 6. Verifying backend container status..."
            sleep 8
            podman ps --filter "name=^${CONTAINER_NAME}$"

            echo "==> 7. Pruning unused dangling images..."
            podman image prune -f
            
            echo "==> NextTurn Backend successfully deployed to Oracle Linux 9 (ARM64) via Tailscale!"
          in: path
          required: true
          description: Time slot UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmSlotRequest'
      responses:
        '200':
          description: Xác nhận khung giờ đặt lịch thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseVoid'

  /api/v1/calendar/settings:
    get:
      tags:
        - Tenant Calendar Management

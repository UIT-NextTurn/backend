        quotas:
          $ref: '#/components/schemas/TenantQuotaResponse'
        createdAt:
          type: string
          description: Tenant onboarding timestamp
          example: '2026-11-15 15:30:00'
        updatedAt:
          type: string
          description: Last update timestamp
          example: '2026-11-15 15:30:00'

    BaseResponseTenantResponse:
      type: object
      properties:
        timestamp:
          type: string
          example: '2026-11-15 15:30:00'
        status:
          type: integer
          example: 200
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Tenant details retrieved successfully
        data:
          $ref: '#/components/schemas/TenantResponse'

    BaseResponseTenantQuotaResponse:
      type: object
      properties:
        timestamp:
          type: string
          example: '2026-11-15 15:30:00'
        status:
          type: integer
          example: 200
        success:
          type: boolean
          example: true
        message:
          type: string

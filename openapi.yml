          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Confirmed appointments exist in the shift window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


        organisationId:
          type: string
          description: Keycloak Organization ID
          example: org-bv-tam-duc
        rejectionReason:
          type: string
          description: Rejection reason if status is REJECTED
          example: Hồ sơ chưa đầy đủ thông tin
        logoUrl:
          type: string

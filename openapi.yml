        '200':
          description: Lấy chính sách đặt hẹn cơ sở thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseCalendarSettingsResponse'

  # ============================================================================
  # 11. Tenant Calendar Management (TenantCalendarController)
  # ============================================================================
  /api/v1/calendar/shifts:
    post:
      tags:
        - Tenant Calendar Management
      operationId: createShifts
      summary: Khởi tạo và phân bổ ca làm việc
      description: Allocates a new operational work shift on the calendar, checks for scheduling overlaps, and automatically generates sequential capacity time slots.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShiftRequest'
      responses:
        '201':
          description: Work shift(s) successfully created and time slots generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseListShiftResponse'
        '400':
          description: Invalid request payload, duration too short, or date in the past
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Staff or service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Overlapping shift detected for staff member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Tenant Calendar Management
      operationId: searchShifts
      summary: Tìm kiếm danh sách ca làm việc
      description: Queries calendar shifts by date range, staff ID, service ID, or status.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
        - name: workDate
          in: query
          required: false
          description: Exact work date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: startDate
          in: query
          required: false
          description: Start date of range filter (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: End date of range filter (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: staffId
          in: query
          required: false
          description: Filter by Staff UUID
          schema:
            type: string
        - name: serviceId
          in: query
          required: false
          description: Filter by Service UUID
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by shift status
          schema:
            $ref: '#/components/schemas/ShiftStatus'
      responses:
        '200':
          description: Lấy danh sách ca làm việc thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseListShiftResponse'

  /api/v1/calendar/shifts/{shiftId}:
    get:
      tags:
        - Tenant Calendar Management
      operationId: getShiftById
      summary: Xem chi tiết ca làm việc
      description: Retrieves details of a specific staff work shift by ID.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
        - name: shiftId
          in: path
          required: true
          description: Shift unique UUID
          schema:
            type: string
      responses:
        '200':
          description: Lấy thông tin ca làm việc thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseShiftResponse'
        '404':
          description: Shift not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Tenant Calendar Management
      operationId: updateShift
      summary: Điều chỉnh ca làm việc
      description: Adjusts operational window of a scheduled work shift. Prevents shortening if booked appointments exist in the cut window.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
        - name: shiftId
          in: path
          required: true
          description: Shift unique UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShiftRequest'
      responses:
        '200':
          description: Điều chỉnh ca làm việc thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseShiftResponse'
        '400':
          description: Invalid shift time window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shift not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Shift overlap or booked appointments exist in the cut window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Tenant Calendar Management
      operationId: cancelShift
      summary: Hủy ca làm việc
      description: Cancels a scheduled shift and recalculates capacity. Blocked if confirmed appointments exist in the shift window.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
        - name: shiftId
          in: path
          required: true
          description: Shift unique UUID
          schema:
            type: string
      responses:
        '200':
          description: Hủy ca làm việc thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseShiftResponse'
        '404':
          description: Shift not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Confirmed appointments exist in the shift window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/calendar/shifts/{shiftId}/cancel:
    put:
      tags:
        - Tenant Calendar Management
      operationId: cancelShiftPut
      summary: Hủy ca làm việc (PUT)
      description: Alternative PUT endpoint to cancel a scheduled shift and recalculate capacity.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
        - name: shiftId
          in: path
          required: true
          description: Shift unique UUID

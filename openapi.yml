    TicketResponse:
      type: object
      description: Electronic queue ticket response with live queue position and wait estimates
      properties:
        id:
          type: string
        ticketCode:
          type: string
        sequenceNumber:
          type: integer
          format: int32
        workDate:
          type: string
          format: date
        serviceId:
          type: string
        serviceCode:
          type: string
        serviceName:
          type: string
        serviceStandardDuration:
          type: integer
          format: int32
        appointmentId:
          type: string
        appointmentCode:
          type: string
        receptionPointId:
          type: string
        receptionPointName:
          type: string
        counterStaffId:
          type: string
        counterStaffName:
          type: string
        counterLabel:
          type: string
        providerId:
          type: string
        providerName:
          type: string
        recallCount:
          type: integer
          format: int32
        version:
          type: integer
          format: int32
        autoCompleted:
          type: boolean
        actualDuration:
          type: integer
          format: int32
        customerType:
          type: string
          enum:
          - APPOINTMENT
          - WALK_IN
        customerName:
          type: string
        customerPhone:
          type: string
        status:
          type: string
          enum:
          - WAITING
          - CALLING
          - SERVING
          - COMPLETED
          - NO_SHOW
        currentServingNumber:
          type: string
          description: Ticket code currently being called or served at counter
          example: A-018
        queuePosition:
          type: integer
          format: int64
          description: 1-based position of this ticket in the WAITING queue (1 = next to be called)
          example: 3
        peopleAheadCount:
          type: integer
          format: int64
          description: Number of waiting customers ahead of this ticket
          example: 2
        estimatedWaitMinutes:
          type: integer
          format: int64
          description: Estimated waiting time in minutes (peopleAheadCount * serviceStandardDuration)
          example: 30
        approachingTurnAlert:
          type: boolean
          description: True when peopleAheadCount <= 2 so UI triggers approaching turn alert
        feedbackToken:
          type: string
          description: One-time CSAT feedback token issued when ticket is COMPLETED (REQ-FEEDBACK-01)
        feedbackExpiresAt:
          type: string
          format: date-time
          description: Expiration timestamp (24h after completion) for the feedback token
        issuedAt:
          type: string
          format: date-time
        calledAt:
          type: string
          format: date-time
        servedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    TicketTransitionRequest:
      type: object
      description: Request payload for ticket recall, completion, or no-show marking with optional optimistic lock version
      properties:
        expectedVersion:
          type: integer
          format: int32
          description: Expected optimistic lock version (returns 409 Conflict if ticket was already modified)
        counterLabel:
          type: string
          description: Optional counter desk label override when recalling a ticket
          example: Quầy 01
    UpdateReceptionPointStatusRequest:
      type: object
      description: Request payload to update reception point operational status
      properties:
        status:
          type: string
          description: Target status (ACTIVE or INACTIVE)
          enum:
          - ACTIVE
          - INACTIVE
          example: ACTIVE
      required:
      - status
    UpsertNotificationTemplateRequest:
      type: object
      description: Upsert payload for customizing a notification template
      properties:
        templateName:
          type: string
          maxLength: 150
          minLength: 0
        channel:
          type: string
          enum:
          - EMAIL
          - PUSH
          - SMS
        subjectTemplate:
          type: string
          maxLength: 255
          minLength: 0
        bodyTemplate:
          type: string
          description: Template body supporting dynamic placeholders like {customer_name}, {service_name}, {appointment_time},
            {ticket_code}, {counter_staff_name}
        isActive:
          type: boolean
      required:
      - bodyTemplate
      - channel
      - templateName
    WalkInCheckInRequest:
      type: object
      description: Request payload for walk-in check-in and queue ticket issuance
      properties:
        serviceId:
          type: string
          description: Target service UUID (optional if inferred from a service-scoped receptionQrToken)
        customerPhone:
          type: string
          description: 10-digit customer phone number
          example: 0901234567
          pattern: ^[0-9]{10}$
        customerName:
          type: string
          description: Optional customer full name
          example: Trần Thị Vãng Lai
          maxLength: 150
          minLength: 0
        receptionQrToken:
          type: string
          description: Optional dynamic/static reception point QR token scanned at the lobby
      required:
      - customerPhone

openapi: 3.0.3
info:
  title: NextTurn Multi-Tenant Platform REST API
  version: 1.0.0
  description: |
    Core REST API specification for NextTurn: Real-time virtual queue orchestration,
    appointment booking, and multi-tenant facility management.

    ### Authentication Spectrum
    - **Public Endpoints**: `/api/v1/health`, `/api/v1/auth/**`, `/api/v1/public/**` (No authentication required)
    - **Staff/Admin Portals**: Secured via Keycloak OIDC JWT Bearer tokens
    - **Tenant Identification (REQ-AUTH-01)**: AWS IAM-style facility code validation
  contact:
    name: NextTurn Engineering Team
    email: engineering@nextturn.internal
  license:
    name: Proprietary
    url: https://nextturn.vn/terms

servers:
  - url: /
    description: Current Server Origin (Relative - Default)
  - url: http://localhost:8080
    description: Local Development Server (Port 8080)
  - url: http://localhost
    description: Caddy Local Edge Reverse Proxy

tags:
  - name: System Telemetry
    description: Endpoints for platform heartbeat, readiness probes, and operational status
  - name: Authentication & Multi-Tenancy
    description: Endpoints for tenant resolution, authentication, and login routing
  - name: Customer Authentication
    description: Passwordless Email OTP authentication for public customers (END_USER)
  - name: Authentication & Tenant SSO
    description: Endpoints for Tenant Administrators to configure enterprise Single Sign-On via Keycloak Organizations
  - name: Tenant Public Registration
    description: Public self-registration API for enterprise organizations (REQ-TNT-05)
  - name: Tenant Management
    description: Endpoints for platform Superadministrators to manage tenant lifecycle, operational quotas, and global telemetry (REQ-TNT-01 to REQ-TNT-04, REQ-TNT-06)
  - name: Tenant Staff Management
    description: Endpoints for Tenant Administrators to manage staff accounts, roles, and service assignments
  - name: Public Service Catalog
    description: Public / Customer endpoints for browsing services and online appointment scheduling
  - name: Tenant Service Catalog
    description: Endpoints for Tenant Administrators to manage services, standard durations, status, and catalog search
  - name: Public Calendar & Booking
    description: Public / Customer endpoints for viewing available booking slots, temporary holding, and facility booking policies
  - name: Tenant Calendar Management
    description: Endpoints for managing calendar work shifts, capacity booking time slots, and facility booking policies

  - name: Public & Customer Appointments
    description: Customer endpoints for slot lookup, temporary holding, booking creation, rescheduling, and cancellation (REQ-APT-01 to REQ-APT-05)
  - name: Tenant & Customer Appointments
    description: Authenticated endpoints for customer appointment history (REQ-APT-05) and facility appointment management
  - name: Reception Point & QR Management
    description: Tenant Admin endpoints for configuring reception points and generating static/60s dynamic check-in QR codes (REQ-CHECK-IN-03)
  - name: Public Lobby Check-in
    description: Customer endpoints for scanning reception point QR codes, checking in pre-booked appointments, and registering walk-in turns (REQ-CHECK-IN-01 to REQ-CHECK-IN-03)
  - name: Public Electronic Queue Tickets
    description: Customer endpoints for issuing queue tickets, tracking wait positions, SSE progress streaming, and ticket recovery (REQ-TICKET-01 to REQ-TICKET-04)
  - name: Tenant Queue Tickets
    description: Authenticated endpoints for viewing and monitoring issued queue tickets
  - name: Counter Queue Calling (FSM)
    description: "Counter staff Kanban and queue calling workflows: call next with dynamic priority, recall, transfer to specialist, complete, and no-show (REQ-QC-01 to REQ-QC-04)"
  - name: Public Lobby Queue Display
    description: Waiting room TV snapshot and real-time SSE stream for called/serving ticket announcements
  - name: Tenant Notifications
    description: Notification template customization, multi-channel delivery log audit, and appointment reminder sweeps (REQ-NOTI-01, REQ-NOTI-04)
  - name: Public Customer Feedback
    description: Public endpoints for validating CSAT feedback links and submitting post-service ratings (REQ-FEEDBACK-01, REQ-FEEDBACK-02)
  - name: Tenant Feedback & CSAT
    description: Admin analytics, CSAT aggregation, and complaint monitoring endpoints (REQ-FEEDBACK-03, REQ-FEEDBACK-04)
  - name: Tenant Operations Dashboard
    description: Real-time tenant KPIs, cancellation/no-show analytics, staff performance & overtime alerts, CSAT trends, and CSV/XLSX exports (REQ-DASHBOARD-01..04)
  - name: Central Platform Monitoring
    description: Superadmin platform overview metrics, real-time SSE stream, and tenant quota alerts (REQ-DASHBOARD-05, REQ-DASHBOARD-06)

paths:
  # ============================================================================
  # 1. System Telemetry (HealthCheckController)
  # ============================================================================
  /api/v1/health:
    get:
      tags:
        - System Telemetry
      operationId: healthCheck
      summary: System health check probe
      description: Returns the operational heartbeat, status, and running version of the backend service.
      security: []
      responses:
        '200':
          description: Service is active and healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseMapStringObject'

  # ============================================================================
  # 2. Authentication & Multi-Tenancy (TenantAuthController)
  # ============================================================================
  /api/v1/auth/tenant/verify:
    post:
      tags:
        - Authentication & Multi-Tenancy
      operationId: verifyTenantPost
      summary: Verify tenant code and resolve staff login route (POST)
      description: "REQ-AUTH-01: Validates tenant code in the master registry. If active, returns tenant profile and pre-configured Keycloak OIDC staff login URL."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantAuthRequest'
      responses:
        '200':
          description: Tenant recognized successfully and login URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantAuthResponse'
        '400':
          description: Validation failure (blank code or invalid characters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tenant facility is inactive, blocked, or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant code not found in central registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/tenant/{tenantCode}:
    get:
      tags:
        - Authentication & Multi-Tenancy
      operationId: verifyTenantGet
      summary: Verify tenant code via path variable (GET)
      description: Idempotent tenant resolution via path variable for deep-linking or QR code scans.
      security: []
      parameters:
        - name: tenantCode
          in: path
          required: true
          description: Alphanumeric unique code for tenant facility
          schema:
            type: string
            minLength: 3
            maxLength: 30
            pattern: '^[a-z0-9-]+$'
            example: clinic-sai-gon
      responses:
        '200':
          description: Tenant recognized successfully and login URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantAuthResponse'
        '400':
          description: Invalid tenant code format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tenant facility is inactive or blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant code not found in central registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/superadmin/login-url:
    get:
      tags:
        - Authentication & Multi-Tenancy
      operationId: getSuperAdminLoginUrl
      summary: Resolve platform-wide Super Admin login URL
      description: Returns pre-configured Keycloak authorization URL without tenant-specific parameters for platform governance.
      security: []
      responses:
        '200':
          description: Super Admin login URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantAuthResponse'

  /api/v1/auth/token:
    post:
      tags:
        - Authentication & Multi-Tenancy
      operationId: exchangeCode
      summary: Exchange authorization code for JWT tokens
      description: Exchanges Keycloak authorization code for tokens, verifies staff roles, and returns user session details.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          description: Tokens exchanged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseAuthTokenResponse'
        '400':
          description: Invalid or expired authorization code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have required staff role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication & Multi-Tenancy
      operationId: refreshToken
      summary: Refresh expired access token
      description: Submits an active refresh token to Keycloak to obtain a fresh access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseAuthTokenResponse'
        '401':
          description: Refresh token expired or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication & Multi-Tenancy
      operationId: logoutTenantStaff
      summary: Logout user and revoke refresh token
      description: Revokes the active OAuth2 refresh token with Keycloak IAM, terminates the session, and clears the security context.
      security: []
      parameters:
        - name: Authorization
          in: header
          required: false
          description: Optional Bearer access token header
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseVoid'

  # ============================================================================
  # 3. Customer Authentication (CustomerAuthController)
  # ============================================================================
  /api/v1/auth/customer/otp/send:
    post:
      tags:
        - Customer Authentication
      operationId: sendCustomerOtp
      summary: Request email OTP verification code
      description: Generates and sends a 6-digit OTP code to the customer's email. If the email already exists in the database, it flags it as an existing account.
      security: []
      parameters:
        - name: X-Widget-Key
          in: header
          required: false
          description: Public integration key of the tenant facility attached in the embedded widget
          schema:
            type: string
        - name: Origin
          in: header
          required: false
          description: Origin domain header of the integrating website
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          description: Referer header of the integrating website
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSendOtpRequest'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseCustomerOtpResponse'
        '400':
          description: Invalid or blank email format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User account is suspended or blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/customer/otp/verify:
    post:
      tags:
        - Customer Authentication
      operationId: verifyCustomerOtp
      summary: Verify OTP and authenticate as END_USER
      description: Verifies the 6-digit OTP. Reuses existing central user record to preserve booking history, or auto-provisions a new account if the email is new. Issues official Keycloak tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerVerifyOtpRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseAuthTokenResponse'
        '400':
          description: Invalid or expired OTP code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User account is suspended or blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Maximum OTP verification attempts exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/customer/logout:
    post:
      tags:
        - Customer Authentication
      operationId: logoutCustomer
      summary: Logout customer and revoke session
      description: Revokes the active customer refresh token in Keycloak IAM and terminates the session.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseVoid'

  /api/v1/auth/customer/widget/sso:
    post:
      tags:
      - Customer Authentication
      operationId: verifyWidgetSso
      summary: Inherit customer identity from host website via HMAC signature (REQ-AUTH-08)
      description: Verifies the 5-minute timestamp window and HMAC-SHA256 signature computed with the facility's widget_secret_key.
        Automatically provisions/updates the customer profile and issues 30-day session tokens without OTP.
      security: []
      parameters:
      - name: X-Widget-Key
        in: header
        required: false
        schema:
          type: string
      - name: Origin
        in: header
        required: false
        schema:
          type: string
      - name: Referer
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerWidgetSsoRequest'
      responses:
        '200':
          description: Widget customer identity verified and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseAuthTokenResponse'
        '401':
          description: Signature mismatch, tampered payload, or expired timestamp (> 5 minutes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unauthorized origin domain, inactive facility, or blocked user account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================================
  # 4. Authentication & Tenant SSO (TenantIdpController)
  # ============================================================================
  /api/v1/auth/idp:
    post:
      tags:
        - Authentication & Tenant SSO
      operationId: configureIdp
      summary: Configure or update external Identity Provider for tenant SSO
      description: Links Google, Microsoft Entra, or OIDC provider to the clinic's Keycloak Organization and registers verified email domains.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureIdpRequest'
      responses:
        '201':
          description: Identity Provider linked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantIdpResponse'
        '400':
          description: Validation failed for IdP payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Authentication & Tenant SSO
      operationId: getIdpConfig
      summary: Get configured Identity Provider details
      description: Returns active SSO provider and email domains for caller's clinic.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
      responses:
        '200':
          description: IdP configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantIdpResponse'
        '404':
          description: No IdP configured for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Authentication & Tenant SSO
      operationId: removeIdp
      summary: Remove external Identity Provider configuration
      description: Unlinks and deletes the IdP instance from Keycloak.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
      responses:
        '200':
          description: IdP removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseVoid'

  # ============================================================================
  # 5. Tenant Public Registration (TenantPublicRegistrationController)
  # ============================================================================
  /api/v1/public/tenants/register:
    post:
      tags:
        - Tenant Public Registration
      operationId: registerTenant
      summary: Enterprise tenant self-registration (REQ-TNT-05)
      description: Submits a new facility registration application. The tenant is placed in PENDING_APPROVAL status awaiting Superadministrator review.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRegistrationRequest'
      responses:
        '201':
          description: Application successfully received and awaiting approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantResponse'
        '400':
          description: Invalid request format or input validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Tenant code or administrator email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================================
  # 6. Tenant Management - SuperAdmin (TenantManagementController)
  # ============================================================================
  /api/v1/central/tenants:
    get:
      tags:
        - Tenant Management
      operationId: searchTenants
      summary: Search, filter, and monitor tenants (REQ-TNT-04)
      description: Searches and filters organizations by multiple criteria (keyword, status) with pagination metadata and operational monitoring metrics (active staff count, today's queue tickets).
      security:
        - BearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          description: Search keyword matching tenant name, code, or admin email
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by tenant lifecycle status
          schema:
            $ref: '#/components/schemas/TenantStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: createdAt
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            default: DESC
      responses:
        '200':
          description: Tenants retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseListTenantMonitoringResponse'
        '403':
          description: Access denied - Superadministrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Tenant Management
      operationId: createTenant
      summary: Provision new tenant organization (REQ-TNT-01)
      description: Superadministrator registers a new facility, provisions an isolated tenant database schema, provisions the administrator account on Keycloak, assigns default operational quotas, and dispatches activation email.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant provisioned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied - Superadministrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Tenant code or administrator email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Keycloak organization synchronization failed (rolled back)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/central/tenants/{tenantId}:
    get:
      tags:
        - Tenant Management
      operationId: getTenant
      summary: Get tenant details by ID or code
      description: Retrieves complete tenant profile, resource quotas, and current active staff count with Valkey read-through caching.
      security:
        - BearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          description: Tenant UUID or tenant code
          schema:
            type: string
      responses:
        '200':
          description: Tenant details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantResponse'
        '403':
          description: Access denied - Superadministrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Tenant Management
      operationId: updateTenant
      summary: Update tenant profile and operational quotas (REQ-TNT-02)
      description: Superadministrator updates administrative profile and operational resource quotas (maximum active staff, daily tickets, services, appointments). Rejects if current active staff exceeds new limit.
      security:
        - BearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          description: Tenant UUID or tenant code
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantResponse'
        '400':
          description: New staff quota is less than active staff count, or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied - Superadministrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Tenant Management
      operationId: deleteTenant
      summary: Delete tenant organization (REQ-TNT-03)
      description: Safely marks organization as soft-deleted and disables Keycloak credentials. Hard deletion is strictly refused if historical tickets, appointments, or reviews exist.
      security:
        - BearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          description: Tenant UUID or tenant code
          schema:
            type: string
      responses:
        '200':
          description: Tenant deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseVoid'
        '403':
          description: Access denied - Superadministrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cannot delete tenant with existing historical operational data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/central/tenants/{tenantId}/quotas:
    get:
      tags:
        - Tenant Management
      operationId: getTenantQuota
      summary: Get tenant operational quotas
      description: Retrieves operational quota limits and current active staff usage for the tenant.
      security:
        - BearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          description: Tenant UUID or tenant code
          schema:
            type: string
      responses:
        '200':
          description: Tenant operational quotas retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantQuotaResponse'
        '403':
          description: Access denied - Superadministrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Tenant Management
      operationId: updateTenantQuotas
      summary: Update operational capacity quotas (REQ-TNT-02)
      description: "Superadministrator modifies operational quotas: maximum active staff, daily ticket quota, services, and future appointments. Supports -1 for unlimited."
      security:
        - BearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          description: Tenant UUID or tenant code
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantQuotaDto'
      responses:
        '200':
          description: Tenant quotas updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantResponse'
        '400':
          description: New staff quota is less than current active staff count
          content:
            application/json:
              schema:

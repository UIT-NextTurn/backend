    CreateAppointmentRequest:
      type: object
      description: Request payload to confirm held slot and create a customer appointment (REQ-APT-03)
      properties:
        slotId:
          type: string
          description: Target time slot UUID currently held by the customer
        holdingToken:
          type: string
          description: Holding session token issued when the slot was locked (REQ-APT-02)
        customerName:
          type: string
          description: Customer full name (2-100 characters)
          example: Nguyễn Văn Khách
          maxLength: 100
          minLength: 2
        customerPhone:
          type: string
          description: Customer phone number (10 digits)
          example: 0901234567
          pattern: ^[0-9]{10}$
        customerEmail:
          type: string
          description: Optional customer email address for confirmation and reminders
          example: khach@example.com
          maxLength: 255
          minLength: 0
          pattern: ^$|^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$
        notes:
          type: string
          description: Optional customer notes (max 255 characters)
          example: Khám định kỳ buổi sáng
          maxLength: 255
          minLength: 0
      required:
      - customerName
      - customerPhone
      - holdingToken
      - slotId
    CreateReceptionPointRequest:
      type: object
      description: Request payload to register a lobby or service reception point for QR check-in
      properties:
        pointCode:
          type: string
          description: Unique reception point code
          example: REC-MAIN-01
          maxLength: 30
          minLength: 0
          pattern: ^[A-Za-z0-9_-]+$
        pointName:
          type: string
          description: Display name of the reception point
          example: Quầy Tiếp Đón Sảnh Chính
          maxLength: 150
          minLength: 0
        locationLabel:
          type: string
          description: Optional physical location label
          example: Tầng 1 - Sảnh A
          maxLength: 150
          minLength: 0
        serviceId:
          type: string
          description: Optional target service UUID (null means general multi-service lobby intake)
        qrMode:
          type: string
          description: 'QR generation mode: DYNAMIC (60s rotation) or STATIC (printed poster)'
          enum:
          - DYNAMIC
          - STATIC
          example: DYNAMIC
        rotationSeconds:
          type: integer
          format: int32
          description: Dynamic QR rotation interval in seconds (default 60s per REQ-CHECK-IN-03)
          example: 60
          minimum: 15
      required:
      - pointCode
      - pointName
    CsatTrendPoint:
      type: object

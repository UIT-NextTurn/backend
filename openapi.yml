        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseQueueBoardResponse'
  /api/v1/queue/call-next:
    post:
      tags:
      - Counter Queue Calling (FSM)
      operationId: callNextTicket
      summary: Bấm gọi số tiếp theo theo điểm ưu tiên động (REQ-QC-01)
      description: Checks counter readiness and specialist capacity (>0), extracts highest priority WAITING ticket (APPOINTMENT=100,
        WALK_IN=0 + 5 pts/min) using FOR UPDATE SKIP LOCKED, and broadcasts SSE updates.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequiredTenantCodeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallNextTicketRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTicketResponse'
  /api/v1/queue/tickets/{ticketId}/complete:
    post:
      tags:
      - Counter Queue Calling (FSM)
      operationId: completeTicket
      summary: Hoàn tất phiên dịch vụ (REQ-QC-03)
      description: Transitions SERVING -> COMPLETED, records actual_duration in seconds, frees specialist capacity, and broadcasts
        SSE update.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequiredTenantCodeHeader'
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketTransitionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTicketResponse'
  /api/v1/queue/tickets/{ticketId}/no-show:
    post:
      tags:
      - Counter Queue Calling (FSM)
      operationId: markNoShow
      summary: Đánh dấu khách vắng mặt tại quầy gọi số (REQ-QC-04)
      description: Transitions CALLING -> NO_SHOW after >= 3 recalls or >= 3 minutes wait, syncs linked appointment to NO_SHOW,
        and clears lobby display.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequiredTenantCodeHeader'
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:

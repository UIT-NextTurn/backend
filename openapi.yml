  /api/v1/central/tenants/{tenantId}/suspend:
    post:
      tags:
        - Tenant Management
      operationId: suspendTenant
      summary: Suspend tenant organization (REQ-TNT-03)
      description: Transitions tenant status to SUSPENDED (strictly allowed only from ACTIVE). Disables staff credentials, revokes active Keycloak sessions, and halts public queue/booking intake.
      security:
        - BearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          description: Tenant UUID or tenant code
          schema:
            type: string
      responses:
        '200':
          description: Tenant suspended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantResponse'
        '400':
          description: Tenant is not in ACTIVE status or is already SUSPENDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied - Superadministrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/central/tenants/{tenantId}/activate:
    post:
      tags:
        - Tenant Management
      operationId: activateTenant
      summary: Reactivate suspended tenant (REQ-TNT-03)
      description: Transitions tenant status back to ACTIVE (strictly allowed only from SUSPENDED; for PENDING_APPROVAL please use the approve endpoint). Restores staff Keycloak access and resumes online services.
      security:
        - BearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          description: Tenant UUID or tenant code
          schema:
            type: string
      responses:
        '200':
          description: Tenant reactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseTenantResponse'
        '400':
          description: Tenant is not in SUSPENDED status or is already ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied - Superadministrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
        - name: slotId
          in: path
          required: true
          description: Time slot UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseSlotRequest'
      responses:
        '200':
          description: Giải phóng khung giờ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseVoid'


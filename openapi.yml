      operationId: recallTicket
      summary: Bấm gọi lại số thứ tự đang gọi (REQ-QC-04)
      description: Increments recall_count on a CALLING ticket without resetting initial called_at timer and re-announces on
        Lobby Display.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequiredTenantCodeHeader'

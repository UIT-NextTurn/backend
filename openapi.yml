  # ============================================================================
  # 7. Tenant Staff Management (TenantStaffController)
  #    Mapped at both /api/v1/staff and /api/v1/auth/staff
  # ============================================================================
  /api/v1/staff:
    post:
      tags:
        - Tenant Staff Management
      operationId: createStaff
      summary: Tiếp nhận và khởi tạo hồ sơ nhân viên
      description: Thêm mới nhân viên vào cơ sở, kiểm tra trùng lặp email/SĐT, tạo tài khoản Keycloak, lưu bản ghi MySQL với trạng thái Active và sinh mã STAFF-xxxx
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: Khởi tạo nhân viên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseStaffResponse'
        '400':
          description: Dữ liệu không hợp lệ hoặc thiếu trường bắt buộc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email hoặc số điện thoại đã tồn tại trong hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Lỗi đồng bộ tài khoản xác thực Keycloak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Tenant Staff Management
      operationId: getStaffList
      summary: Danh sách nhân viên
      description: Lấy danh sách nhân viên trong cơ sở kèm thông tin phân trang và hỗ trợ lọc theo từ khóa, vai trò, trạng thái
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
        - name: keyword
          in: query
          required: false
          description: Từ khóa tìm kiếm (họ tên, email, SĐT, mã nhân viên)
          schema:
            type: string
        - name: role
          in: query
          required: false
          description: Bộ lọc vai trò (ADMIN, COUNTER, SPECIALIST)
          schema:
            $ref: '#/components/schemas/StaffRole'
        - name: status
          in: query
          required: false
          description: Bộ lọc trạng thái (ACTIVE, INACTIVE)
          schema:
            $ref: '#/components/schemas/StaffStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Lấy danh sách nhân viên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseListStaffResponse'

  /api/v1/staff/{staffId}:
    get:
      tags:
        - Tenant Staff Management
      operationId: getStaffById
      summary: Chi tiết nhân viên
      description: Lấy thông tin chi tiết một nhân viên theo ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
        - name: staffId
          in: path
          required: true
          description: Staff UUID
          schema:
            type: string
      responses:
        '200':
          description: Lấy chi tiết nhân viên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseStaffResponse'
        '404':
          description: Nhân viên không tồn tại hoặc đã bị xóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Tenant Staff Management
      operationId: updateStaff
      summary: Cập nhật hồ sơ hoặc trạng thái nhân viên
      description: Cập nhật họ tên, số điện thoại, vai trò hoặc trạng thái hoạt động (khóa/tạm ngưng) của nhân viên. Khi khóa/tạm ngưng (status = INACTIVE), hệ thống kiểm tra các cuộc hẹn hoặc ca trực trong tương lai và đồng bộ trạng thái tài khoản trên Keycloak.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
        - name: staffId
          in: path
          required: true
          description: Staff UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffRequest'
      responses:
        '200':
          description: Cập nhật thông tin nhân viên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseStaffResponse'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Nhân viên không tồn tại hoặc đã bị xóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Số điện thoại bị trùng lặp hoặc nhân viên còn lịch hẹn/ca trực tương lai chưa chuyển giao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Tenant Staff Management
      operationId: deleteStaff
      summary: Xóa hoặc vô hiệu hóa nhân viên
      description: Đánh dấu xóa logic nhân viên khỏi hệ thống (is_deleted = true, status = INACTIVE). Nếu hardDelete = true, hệ thống kiểm tra lịch sử gọi vé và phản hồi đánh giá, tuyệt đối từ chối xóa vật lý nếu đã có dữ liệu lịch sử.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredTenantCodeHeader'
        - name: staffId
          in: path
          required: true
          description: Staff UUID
          schema:
            type: string
        - name: hardDelete
          in: query
          required: false
          description: Tùy chọn xóa vật lý (mặc định false - xóa logic)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Xóa hoặc vô hiệu hóa nhân viên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseVoid'
        '404':
          description: Nhân viên không tồn tại hoặc đã bị xóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Còn lịch hẹn/ca trực tương lai hoặc có dữ liệu lịch sử ngăn cản xóa vật lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


          description: Minimum lead time hours required before appointment start time
          example: 2
        maxAdvanceBookingDays:
          type: integer
          description: Maximum days in advance that customers can book appointments
          example: 30
        cancellationDeadlineHours:
          type: integer
          description: Cut-off hours prior to appointment when self-cancellation is permitted
          example: 12
        updatedAt:
          type: string
          description: Last settings modification timestamp
          example: '2026-11-15 15:30:00'


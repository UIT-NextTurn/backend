          type: number
          format: double
        csatPercentage:
          type: number
          format: double
    CustomerWidgetSsoRequest:
      type: object
      description: Request payload for embedded widget customer SSO via HMAC-SHA256 signature (REQ-AUTH-08)
      properties:
        widgetApiKey:
          type: string
          description: Public widget integration key of the tenant facility (can also be sent via X-Widget-Key header)
          example: nt_pub_a8b9c0d1e2
        externalMemberId:
          type: string
          description: External member identifier on the enterprise host website
          example: MEM-998877
        fullName:
          type: string
          description: Customer full name from enterprise website
          example: Nguyễn Văn Khách
        email:
          type: string
          description: Customer email address from enterprise website
          example: khach.nguyen@example.com
        phoneNumber:
          type: string
          description: Customer phone number from enterprise website
          example: 0901234567
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp (in seconds or milliseconds) when the signature was generated
          example: 1795250000
        signature:
          type: string
          description: HMAC-SHA256 hex or Base64 signature computed over canonical payload using tenant's widget_secret_key
        originDomain:
          type: string
          description: Optional explicit host website domain for origin verification
          example: https://clinic-saigon.vn
      required:
      - externalMemberId
      - fullName
      - signature
      - timestamp

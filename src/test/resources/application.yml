# ===================================================================
# NextTurn Test Profile Configuration (In-Memory H2 with MySQL syntax mode)
# ===================================================================
spring:
  application:
    name: nextturn-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false


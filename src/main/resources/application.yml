# ===================================================================
# NextTurn Backend Application Configuration
# ===================================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: nextturn-backend

  # -------------------------------------------------------------------
  # MySQL DataSource Configuration
  # -------------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nextturn_master?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:nextturn}
    password: ${SPRING_DATASOURCE_PASSWORD:nextturn_dev_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # -------------------------------------------------------------------
  # JPA / Hibernate ORM Configuration
  # -------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  # -------------------------------------------------------------------
  # Jackson Date/Time Formatting
  # -------------------------------------------------------------------
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}

  # -------------------------------------------------------------------
  # Flyway Database Migration Configuration
  # -------------------------------------------------------------------
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration/central}
    baseline-on-migrate: true

  # -------------------------------------------------------------------
  # Keycloak OAuth2 Resource Server & JWT Configuration
  # -------------------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/nextturn}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/nextturn/protocol/openid-connect/certs}

# -------------------------------------------------------------------
# Keycloak Client Configuration
# -------------------------------------------------------------------
keycloak:
  client-id: ${KEYCLOAK_CLIENT_ID:nextturn-backend}
  realm: ${KEYCLOAK_REALM:nextturn}
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/nextturn}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/nextturn/protocol/openid-connect/certs}


# -------------------------------------------------------------------
# Valkey Cache & Queue Store Configuration
# -------------------------------------------------------------------
valkey:
  host: ${VALKEY_HOST:localhost}
  port: ${VALKEY_PORT:6379}
  password: ${VALKEY_PASSWORD:}

# -------------------------------------------------------------------
# CORS Cross-Origin Resource Sharing Configuration
# -------------------------------------------------------------------
cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Origin,Content-Type,Accept,Authorization,X-Requested-With}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  max-age: ${CORS_MAX_AGE_SECONDS:3600}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}


